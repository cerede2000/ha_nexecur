name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ["2026.10.3", "2026.10.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_test.txt
      # The pinned fixture package targets 2026.10.4. Exercise the reported
      # patch release with the same harness and dependencies as well.
      - run: pip install --no-deps homeassistant==${{ matrix.homeassistant }}
      - run: ruff check custom_components/nexecur/api.py custom_components/nexecur/config_flow.py tests
      - run: ruff format --check custom_components/nexecur/api.py custom_components/nexecur/config_flow.py tests
      - run: pytest -q
